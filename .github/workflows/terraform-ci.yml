name: Terraform CI

on:
  pull_request:
    branches: [main]
    paths:
      - "terraform/demo/**"
      - ".github/workflows/terraform-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Terraform Validate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/demo

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.8.0"

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

  security:
    name: Terraform Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Trivy IaC report
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297
        with:
          scan-type: config
          scan-ref: terraform/demo
          severity: MEDIUM,HIGH,CRITICAL
          exit-code: '0'

      - name: Trivy IaC security gate
        uses: aquasecurity/trivy-action@<PINNED_SHA>
        with:
          scan-type: config
          scan-ref: terraform/demo
          severity: HIGH,CRITICAL
          exit-code: '1'