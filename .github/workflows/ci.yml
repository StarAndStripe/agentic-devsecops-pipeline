name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest 2>&1 | tee failed-ci.log

      - name: Build bounded failure context
        if: failure()
        run: |
          python scripts/collect_failure_context.py \
            --workflow "CI" \
            --job "Python Tests" \
            --commit-sha "${{ github.sha }}" \
            --changed-files "src/pricing.py" \
            --log-file "failed-ci.log" \
            --output "artifacts/failure-context.json"

      - name: Upload failure context
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-failure-context
          path: artifacts/failure-context.json
          retention-days: 1
          if-no-files-found: error